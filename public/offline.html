<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#201C1A">
  <title>Offline — Kopi Seruni POS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F7F5F0;
      color: #201C1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background-color: #FFFFFF;
      border: 1px solid #E6E0D8;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px -2px rgba(32, 28, 26, 0.06);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background-color: #F3EFEA;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #54382B;
    }
    .brand {
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #54382B;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      color: #201C1A;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.5;
      color: #635C57;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background-color: #201C1A;
      color: #FFFFFF;
      border: none;
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover, .btn:active {
      background-color: #38302C;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="brand">Kopi Seruni POS</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Sistem POS Kopi Seruni membutuhkan koneksi internet aktif untuk transaksi, pembaruan stok, dan sinkronisasi data kasir.</p>
    <button class="btn" onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
